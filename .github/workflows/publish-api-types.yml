name: publish-api-types

# @adbls/api-types is generated by CORE's build, which runs on a private Forgejo. Forgejo is not an
# npm trusted-publishing provider, so CORE publishes each release to its Forgejo registry only, and
# this workflow copies new releases to npmjs.org with an OIDC identity instead of an npm token.
# Configured on npmjs.com for @adbls/api-types as: Adibilis/sdk + publish-api-types.yml.
#
# CORE's release job triggers it right after publishing to Forgejo (repository_dispatch
# `api-types-release`). The hourly schedule is the safety net: a missed trigger or a failed run heals
# itself on the next one. Only versions newer than npm's `latest` are copied, oldest first, so
# `latest` never moves backwards. Prereleases (dev/stage) are never copied.

on:
  repository_dispatch:
    types: [api-types-release]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: publish-api-types
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PKG: '@adbls/api-types'
      FORGEJO_NPM: https://forge.cloud.adibilis.ch/api/packages/core/npm
      # read:package token of a Forgejo bot user. Forgejo tokens don't expire; npm tokens would.
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_PACKAGES_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - name: Find releases missing on npmjs
        id: plan
        run: |
          set -euo pipefail
          : "${FORGEJO_TOKEN:?secret FORGEJO_PACKAGES_TOKEN is not set}"
          curl -fsS -H "Authorization: token ${FORGEJO_TOKEN}" "${FORGEJO_NPM}/${PKG/\//%2F}" > forgejo.json
          LATEST=$(npm view "$PKG" dist-tags.latest 2>/dev/null || echo 0.0.0)
          node -e '
            const [cur] = process.argv.slice(1);
            const f = require("./forgejo.json");
            const semver = v => v.split(".").map(Number);
            const newer = (a, b) => { const x = semver(a), y = semver(b);
              for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] > y[i]; return false; };
            const todo = Object.keys(f.versions)
              .filter(v => /^\d+\.\d+\.\d+$/.test(v) && newer(v, cur))
              .sort((a, b) => newer(a, b) ? 1 : -1);
            require("fs").writeFileSync("todo.txt", todo.map(v => `${v} ${f.versions[v].dist.tarball}`).join("\n"));
            console.log(`npm latest ${cur}; to copy: ${todo.join(", ") || "nothing"}`);
          ' "$LATEST"
      - name: Copy them
        run: |
          set -euo pipefail
          while read -r VERSION TARBALL; do
            [ -n "$VERSION" ] || continue
            rm -rf pkg && mkdir pkg
            curl -fsS -H "Authorization: token ${FORGEJO_TOKEN}" "$TARBALL" | tar -xz -C pkg --strip-components=1
            cd pkg
            test "$(node -p 'require("./package.json").name')" = "$PKG"
            test "$(node -p 'require("./package.json").version')" = "$VERSION"
            # CORE's CI points publishConfig at Forgejo; it outranks every other registry setting.
            npm pkg set publishConfig.registry=https://registry.npmjs.org/ publishConfig.access=public
            npm publish --tag latest
            cd ..
          done < todo.txt
